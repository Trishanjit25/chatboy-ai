<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1a1a2e;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a4a;
        }
        header h1 { font-size: 1.4rem; color: #7c6af7; }
        header a { color: #7c6af7; text-decoration: none; font-size: 0.9rem; }
        header a:hover { text-decoration: underline; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #7c6af7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            background: #1e1e35;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a4a;
        }
        .typing {
            color: #888;
            font-style: italic;
            font-size: 0.85rem;
            align-self: flex-start;
        }
        #input-area {
            display: flex;
            padding: 16px 24px;
            gap: 12px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
        }
        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            resize: none;
        }
        #user-input:focus { border-color: #7c6af7; }
        #send-btn {
            padding: 12px 24px;
            background: #7c6af7;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        #send-btn:hover { background: #6355d8; }
        #send-btn:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 AI Chatbot</h1>
        <a href="/about">About</a>
    </header>

    <div id="chat-container">
        <div class="message bot-msg">👋 Hello! I'm your AI assistant. Ask me anything!</div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Type your message... (Enter to send)"></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            appendMessage(prompt, 'user-msg');
            userInput.value = '';
            sendBtn.disabled = true;

            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.textContent = 'AI is thinking...';
            chatContainer.appendChild(typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch(`/ai?prompt=${encodeURIComponent(prompt)}`);
                const data = await res.json();
                typing.remove();
                appendMessage(data.response || data.error || 'No response.', 'bot-msg');
            } catch (err) {
                typing.remove();
                appendMessage('❌ Error connecting to server.', 'bot-msg');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        function appendMessage(text, cls) {
            const div = document.createElement('div');
            div.className = `message ${cls}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
