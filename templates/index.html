<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Boy - AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:🤖">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-logo">
            <span class="logo-icon">🤖</span>
            <h1>Chat Boy</h1>
        </div>
        <nav class="header-nav">
            <a href="/about">About</a>
        </nav>
    </header>

    <!-- Chat Container -->
    <div id="chat-container">
        <!-- Welcome Message -->
        <div class="welcome-message">
            <div class="avatar">👋</div>
            <h2>Welcome to Chat Boy!</h2>
            <p>Your intelligent AI assistant. Ask me anything and I'll do my best to help you!</p>
        </div>
    </div>

    <!-- Input Area -->
    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Type your message... (Enter to send)"></textarea>
            <div class="input-footer">
                <span class="char-counter">0/2000</span>
                <div class="input-hints">
                    <span><kbd>Enter</kbd> Send</span>
                    <span><kbd>Ctrl+Enter</kbd> New line</span>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="action-btn" id="emoji-btn" title="Emoji (Coming soon)">😊</button>
            <button class="action-btn" id="voice-btn" title="Voice input (Coming soon)">🎤</button>
        </div>
        
        <button id="send-btn" onclick="sendMessage()">
            <span>Send</span>
            <span>➤</span>
        </button>
    </div>

    <!-- Scroll to Bottom Button -->
    <button class="scroll-indicator" id="scroll-bottom" title="Scroll to bottom">↓</button>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="/static/animations.js"></script>
</body>
</html>
